<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>สแกน QR</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>
body{
font-family:Arial;
text-align:center;
background:#f4f4f4;
margin:0;
}

h2{
margin-top:30px;
}

#reader{
width:320px;
margin:auto;
margin-top:20px;
}

.back-btn{
display:inline-block;
margin-top:20px;
padding:10px 15px;
background:#d71920;
color:white;
text-decoration:none;
border-radius:6px;
}
</style>

</head>

<body>

<h2>📷 สแกน QR Code</h2>

<div id="reader"></div>

<a href="/staff_dashboard" class="back-btn">⬅ กลับหน้าหลัก</a>

<script>

function onScanSuccess(decodedText, decodedResult) {

    // หยุดกล้องก่อน
    scanner.clear();

    // เปิดลิงก์ใน QR
    if(decodedText.startsWith("http")){
        window.location.href = decodedText;
    }

}

const scanner = new Html5QrcodeScanner(
    "reader",
    {
        fps: 10,
        qrbox: 250,
        rememberLastUsedCamera: true
    }
);

scanner.render(onScanSuccess);

</script>

</body>
</html>
