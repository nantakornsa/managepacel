<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>สแกน QR</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>
body{
font-family:Arial;
text-align:center;
background:#f4f4f4;
}

#reader{
width:320px;
margin:auto;
margin-top:50px;
}
</style>

</head>

<body>

<h2>📷 สแกน QR Code</h2>

<div id="reader"></div>

<script>

function onScanSuccess(decodedText) {

    // เมื่อสแกนได้จะเปิดลิงก์ใน QR
    window.location.href = decodedText

}

let scanner = new Html5QrcodeScanner(
    "reader",
    { fps: 10, qrbox: 250 }
)

scanner.render(onScanSuccess)

</script>

</body>
</html>
